[versions]
agp = "8.13.2"
# NDK for native/rapidyenc and the app (its packaging strips every native library). Without it AGP
# uses its own default NDK and, if that one is not installed, packages the libraries unstripped.
ndk = "27.1.12297006"
kotlin = "2.3.21"
jna = "5.17.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
coroutines = "1.11.0"
junit = "5.11.4"
media3 = "1.11.1"
# Newest releases that still support AGP 8.13 + compileSdk 36. Compose BOM 2026.08.00+
# (UI 1.12), lifecycle 2.11 and core 1.19 require AGP 9.1 + compileSdk 37.
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.8"  # 2.10 needs AGP 9.1 + compileSdk 37
core-ktx = "1.18.0"
core-splashscreen = "1.2.0"
junit-platform = "1.11.4"
slf4j = "2.0.20"
ktor = "3.5.2"
room = "2.8.5"
ksp = "2.3.12"
datastore = "1.2.1"
coil = "3.5.0"  # 3.6 needs Compose 1.12 (AGP 9.1 + compileSdk 37)
# The usenet libraries' releases on JitPack: the first ones built for Java 17. Every earlier tag is a Java 25 build,
# which the app's Java 17 modules can't use. The root build.gradle.kts makes these versions win wherever a library's
# POM names another one.
nzb-streamer = "v0.11.0"
ktor-nntp-client = "v0.8.0"
kotlin-compression-utils = "v0.4.1"
rapidyenc-wrapper = "v0.4.0"
asm = "9.8"
# The phone setup's QR code (TV-8): core only, pure Java 8 bytecode, Apache-2.0 (its texts in app/src/main/assets/licenses).
zxing = "3.5.4"
# Google Cast (C1), in every build since C2 (L105): Google's Cast SDK as media3-cast 1.11.1 asks for it, Play services'
# base for its availability check, and MediaRouter, which the app calls itself.
play-services-cast = "22.3.1"
play-services-base = "18.7.2"
mediarouter = "1.8.1"

[libraries]
nzb-streamer = { module = "com.github.skjaere:nzb-streamer", version.ref = "nzb-streamer" }
ktor-nntp-client = { module = "com.github.skjaere:ktor-nntp-client", version.ref = "ktor-nntp-client" }
rapidyenc-wrapper = { module = "com.github.skjaere:rapidyenc-kotlin-wrapper", version.ref = "rapidyenc-wrapper" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlin-compression-utils = { module = "com.github.skjaere:kotlin-compression-utils", version.ref = "kotlin-compression-utils" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "play-services-cast" }
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "play-services-base" }
mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
